databaseChangeLog:
  - changeSet:
      id: 5-reset-empty-generated-id-sequences
      author: developer@securitease.com
      changes:
        - sql:
            sql: |
              SELECT setval(
                pg_get_serial_sequence('customer', 'id'),
                COALESCE((SELECT MAX(id) FROM customer), 1),
                (SELECT COUNT(*) > 0 FROM customer)
              );
              SELECT setval(
                pg_get_serial_sequence('"order"', 'id'),
                COALESCE((SELECT MAX(id) FROM "order"), 1),
                (SELECT COUNT(*) > 0 FROM "order")
              );
              SELECT setval(
                pg_get_serial_sequence('product', 'id'),
                COALESCE((SELECT MAX(id) FROM product), 1),
                (SELECT COUNT(*) > 0 FROM product)
              );
